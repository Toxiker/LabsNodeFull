version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynet

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - mynet

  app:
    build: .
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - db
    environment:
      - NODE_ENV=development
      - PORT=4000
      - POSTGRES_DB=mydb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - DB_HOST=db
      - DB_PORT=5432
    networks:
      - mynet
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:

networks:
  mynet:
    driver: bridge 